name: ew_brother_ew
description: "Ew Brother Ew. Counts Reels and Shorts, pauses you every N, keeps tasks and habits in one fast screen."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  provider: 6.1.5+1
  sqflite: 2.4.5
  path: any
  fl_chart: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
